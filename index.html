<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SSC Alumni Hub | Shambhupur High School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header Component -->
<div class="glass-header">
    <div class="header-container">
        <div class="top-bar">
            <div class="logo-brand">
                <div class="logo-circle">
                    <img id="schoolLogoImg" src="https://drive.google.com/thumbnail?id=1qexbONE4EDUtCZUXzJTsFSL-YbWzJ6lp&sz=s200" alt="School Crest">
                </div>
                <div class="title-text">
                    <h2>Shambhupur High School</h2>
                    <p>SSC Alumni Hub • Since 1966</p>
                </div>
            </div>
            <div class="menu-btn" id="openSidebarBtn">
                <i class="fas fa-bars-staggered"></i>
            </div>
        </div>
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="globalSearch" class="search-field" placeholder="Search alumni...">
        </div>
    </div>
    <div class="batch-scroll-x" id="batchChipContainer">
        <div class="batch-pill active"><i class="fas fa-trophy"></i> All Batches</div>
    </div>
</div>

<!-- Sidebar Include -->
<div id="sidebarContainer"></div>

<!-- Main Views -->
<div id="homeView" class="main-container">
    <div class="dashboard-stats">
        <div class="stat-card-glass"><div class="stat-label"><i class="fas fa-user-graduate"></i> REGISTERED</div><div class="stat-number" id="totalRegCount">0</div></div>
        <div class="stat-card-glass"><div class="stat-label"><i class="fas fa-users"></i> TOTAL GUESTS</div><div class="stat-number" id="totalGuestCount">0</div></div>
        <div class="stat-card-glass collection-card">
            <div class="stat-label"><i class="fas fa-coins collection-icon"></i> TOTAL COLLECTION</div>
            <div class="stat-number collection-number" id="totalCollectionDisplay">৳0</div>
        </div>
    </div>
    <div id="alumniListRender"></div>
</div>

<div id="statsView" style="display: none;">
    <h3 style="text-align:center; font-size:1.3rem; font-weight:800; margin-bottom:16px;"><i class="fas fa-chart-pie"></i> Batch Analytics</h3>
    <div id="batchStatsContainer"></div>
</div>

<div id="formView" style="display: none;">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd-oCJ0iAE84yL3rm-FtZgdET6Lj_AHsW9OgsHYbGH0VYroug/viewform?embedded=true">Loading...</iframe>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="premium-modal">
    <div class="modal-inner">
        <div class="close-modal" id="closeModalIcon"><i class="fas fa-times"></i></div>
        <img id="modalAvatar" class="modal-photo-fixed" src="">
        <h3 id="modalFullName" style="font-weight:800; margin: 5px 0;">Alumni Member</h3>
        <div style="max-height: 55vh; overflow-y: auto; margin-top: 10px;">
            <table class="detail-table" id="modalInfoTable"></table>
        </div>
        <div class="mt-2"><i class="fas fa-graduation-cap text-primary"></i> <span class="text-muted small">Shambhupur High School</span></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
